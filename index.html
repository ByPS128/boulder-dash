<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Boulder Dash (Phaser 3 + TS)</title>

    <!-- Disable all caching for development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
      /* Hra renderuje vlastní Atari bitmap font na plátno (viz src/ui/AtariFont.ts),
         takže žádný webový font tu nepotřebujeme. */
      html, body { margin: 0; height: 100%; background: #000; font-family: monospace; }
      #app { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
