<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Boulder Dash (Phaser 3 + TS)</title>

    <!-- Disable all caching for development -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <style>
      /* Atari 800 XL Font - authentic retro look with Czech diacritics support */
      @font-face {
        font-family: 'Atari';
        src: url('resources/atari.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      
      html, body { margin: 0; height: 100%; background: #000; font-family: 'Atari', monospace; }
      #app { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    </style>
    
    <!-- Preload font before Phaser starts -->
    <link rel="preload" href="resources/atari.ttf" as="font" type="font/ttf" crossorigin>
  </head>
  <body>
    <div id="app"></div>
    
    <!-- Force font load before starting Phaser -->
    <script>
      // Wait for font to load before starting the game
      document.fonts.ready.then(() => {
        console.log('Atari font loaded successfully');
      });
    </script>
    
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
